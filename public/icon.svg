<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="beak" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- App Icon Background Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  
  <!-- Cloud Accents in Background -->
  <path d="M 90 200 A 35 35 0 0 1 150 180 A 50 50 0 0 1 230 200 A 35 35 0 0 1 210 240 L 100 240 A 35 35 0 0 1 90 200 Z" fill="#ffffff" opacity="0.4"/>
  <path d="M 320 140 A 25 25 0 0 1 370 120 A 40 40 0 0 1 430 140 A 25 25 0 0 1 410 170 L 330 170 A 25 25 0 0 1 320 140 Z" fill="#ffffff" opacity="0.3"/>

  <!-- Bird Group with Drop Shadow -->
  <g filter="url(#shadow)" transform="translate(15, 10)">
    <!-- Tail feathers -->
    <path d="M 170 270 L 105 240 L 125 285 L 95 320 L 175 300 Z" fill="#eab308" stroke="#854d0e" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Bird Body -->
    <ellipse cx="255" cy="275" rx="115" ry="95" fill="url(#body)" stroke="#854d0e" stroke-width="14"/>
    
    <!-- Belly Patch -->
    <ellipse cx="230" cy="310" rx="70" ry="48" fill="#fef9c3"/>
    
    <!-- Wing -->
    <ellipse cx="205" cy="270" rx="55" ry="38" fill="#fde047" stroke="#ca8a04" stroke-width="12" transform="rotate(-15, 205, 270)"/>
    
    <!-- Beak -->
    <path d="M 330 250 L 430 285 L 330 320 Z" fill="url(#beak)" stroke="#9a3412" stroke-width="12" stroke-linejoin="round"/>
    <line x1="330" y1="285" x2="415" y2="285" stroke="#7c2d12" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Rosy Cheek -->
    <circle cx="280" cy="305" r="22" fill="#f43f5e" opacity="0.5"/>
    
    <!-- Big Eye Outer (White) -->
    <circle cx="310" cy="235" r="40" fill="#ffffff" stroke="#854d0e" stroke-width="12"/>
    
    <!-- Eye Pupil -->
    <circle cx="325" cy="235" r="18" fill="#0f172a"/>
    
    <!-- Catchlight reflection -->
    <circle cx="318" cy="225" r="7" fill="#ffffff"/>
  </g>
</svg>
