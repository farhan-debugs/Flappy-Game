<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#090d16" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Cross-platform Flappy Bird game built for Android and Windows with responsive touch and keyboard controls." />
  <title>Flappy Bird - Cross-Platform Edition</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body>
  <div id="app-container">
    <!-- Action Toolbar -->
    <header class="top-bar">
      <div class="top-bar-left">
        <button id="btn-mute" class="icon-btn" aria-label="Toggle Sound" title="Toggle Sound">🔊</button>
        <button id="btn-pause" class="icon-btn" aria-label="Pause Game" title="Pause Game">⏸️</button>
      </div>
      <div class="top-bar-right">
        <button id="btn-install" class="install-pill" aria-label="Install App">📲 Install App</button>
        <button id="btn-fullscreen" class="icon-btn" aria-label="Toggle Fullscreen" title="Toggle Fullscreen">⛶</button>
      </div>
    </header>

    <!-- Canvas Game Container -->
    <main class="canvas-wrapper">
      <canvas id="game-canvas"></canvas>
    </main>

    <!-- Desktop Windows Controls Hint -->
    <footer class="desktop-controls-hint">
      Controls: <span class="key-badge">Space</span> / <span class="key-badge">W</span> / <span class="key-badge">Click</span> to Flap &bull; <span class="key-badge">Esc</span> Pause &bull; <span class="key-badge">M</span> Mute
    </footer>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
