<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Flappy Game</title>
  <style>
    body {
      margin: 0;
      background: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: system-ui, sans-serif;
      color: #fff;
    }

    canvas {
      background: linear-gradient(#4ec0ca, #ffffff);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="game" width="400" height="600"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    // ----- Game constants -----
    const BIRD_X = 80;
    const BIRD_RADIUS = 13; // slightly forgiving hitbox
    const GRAVITY = 0.26; // gentler gravity for easier control
    const JUMP_STRENGTH = -5.4; // softer, comfortable jump intensity
    const MAX_FALL_SPEED = 6.5; // capped fall speed so the bird never plummets uncontrollably
    const PIPE_WIDTH = 58;
    const PIPE_GAP = 165; // wider gap between pipes for friendlier navigation
    const PIPE_SPEED = 2.0; // relaxed pipe scroll speed
    const PIPE_INTERVAL = 175; // comfortable spacing between pipe pairs
    const GROUND_HEIGHT = 40;

    // ----- Game state -----
    let birdY;
    let birdVelocity;
    let pipes;
    let frameCount;
    let score;
    let bestScore = 0;
    let gameOver;
    let started;

    // ----- Audio System (Web Audio API) -----
    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // High, crisp chime when scoring a point
    function playPointSound() {
      try {
        const actx = getAudioContext();
        if (!actx) return;
        const now = actx.currentTime;

        const osc = actx.createOscillator();
        const gain = actx.createGain();

        osc.type = "sine";
        // Ascending chime: B5 (988 Hz) -> E6 (1319 Hz)
        osc.frequency.setValueAtTime(987.77, now);
        osc.frequency.setValueAtTime(1318.51, now + 0.08);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

        osc.connect(gain);
        gain.connect(actx.destination);

        osc.start(now);
        osc.stop(now + 0.35);
      } catch (e) {
        // Fallback silently if audio fails
      }
    }

    // Impact punch + descending sad tone on game over
    function playGameOverSound() {
      try {
        const actx = getAudioContext();
        if (!actx) return;
        const now = actx.currentTime;

        // Punch thump
        const osc1 = actx.createOscillator();
        const gain1 = actx.createGain();
        osc1.type = "triangle";
        osc1.frequency.setValueAtTime(160, now);
        osc1.frequency.exponentialRampToValueAtTime(45, now + 0.16);
        gain1.gain.setValueAtTime(0.35, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
        osc1.connect(gain1);
        gain1.connect(actx.destination);
        osc1.start(now);
        osc1.stop(now + 0.16);

        // Sad sliding tone
        const osc2 = actx.createOscillator();
        const gain2 = actx.createGain();
        osc2.type = "sawtooth";
        osc2.frequency.setValueAtTime(260, now + 0.12);
        osc2.frequency.exponentialRampToValueAtTime(70, now + 0.6);
        gain2.gain.setValueAtTime(0, now);
        gain2.gain.setValueAtTime(0.2, now + 0.12);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
        osc2.connect(gain2);
        gain2.connect(actx.destination);
        osc2.start(now + 0.12);
        osc2.stop(now + 0.65);
      } catch (e) {
        // Fallback silently
      }
    }

    function resetGame() {
      birdY = canvas.height / 2;
      birdVelocity = 0;
      pipes = [];
      frameCount = 0;
      score = 0;
      gameOver = false;
      started = false;
    }

    // Create a new pipe with a random gap position
    function createPipe() {
      const margin = 50; // min distance from top/bottom
      const maxGapY = (canvas.height - GROUND_HEIGHT) - margin - PIPE_GAP;
      const gapY = margin + Math.random() * (maxGapY - margin);

      pipes.push({
        x: canvas.width,
        gapY: gapY
      });
    }

    // Check collision between bird and pipes / ground / ceiling
    function checkCollision() {
      // Prevent flying through the ceiling without instant harsh death
      if (birdY - BIRD_RADIUS <= 0) {
        birdY = BIRD_RADIUS;
        birdVelocity = 0;
      }

      // Collision with ground
      if (birdY + BIRD_RADIUS >= canvas.height - GROUND_HEIGHT) {
        return true;
      }

      // Collision with pipes (using slightly forgiving inner radius)
      const hitRadius = BIRD_RADIUS - 2;
      for (const pipe of pipes) {
        const inPipeX =
          BIRD_X + hitRadius > pipe.x &&
          BIRD_X - hitRadius < pipe.x + PIPE_WIDTH;

        const aboveGap = birdY - hitRadius < pipe.gapY;
        const belowGap = birdY + hitRadius > pipe.gapY + PIPE_GAP;

        if (inPipeX && (aboveGap || belowGap)) {
          return true;
        }
      }

      return false;
    }

    // Draw the yellow bird with beak, eye, flapping wing, and tilt
    function drawBird() {
      ctx.save();
      ctx.translate(BIRD_X, birdY);

      // Smooth tilt rotation based on bird velocity
      // Pitches up on flap (-22 deg) and tilts downward on fall (up to 70 deg)
      const pitch = Math.min(Math.PI / 2.6, Math.max(-Math.PI / 7.5, birdVelocity * 0.09));
      ctx.rotate(pitch);

      // Flapping wing motion (active when playing, gentle hover when idle)
      const flapFrequency = started && !gameOver ? 0.28 : 0.15;
      const wingFlap = Math.sin(frameCount * flapFrequency);

      // --- Tail Feathers ---
      ctx.beginPath();
      ctx.moveTo(-12, -2);
      ctx.lineTo(-19, -6);
      ctx.lineTo(-16, 1);
      ctx.lineTo(-19, 6);
      ctx.lineTo(-12, 3);
      ctx.fillStyle = "#eab308";
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = "#854d0e";
      ctx.stroke();

      // --- Bird Body ---
      ctx.beginPath();
      ctx.ellipse(0, 0, 16, 13, 0, 0, Math.PI * 2);
      const bodyGrad = ctx.createRadialGradient(-3, -4, 2, 0, 0, 16);
      bodyGrad.addColorStop(0, "#fff566");
      bodyGrad.addColorStop(0.65, "#facc15");
      bodyGrad.addColorStop(1, "#eab308");
      ctx.fillStyle = bodyGrad;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#854d0e";
      ctx.stroke();

      // --- Belly Patch ---
      ctx.beginPath();
      ctx.ellipse(-2, 4, 10, 7, 0.25, 0, Math.PI * 2);
      ctx.fillStyle = "#fef08a";
      ctx.fill();

      // --- Rosy Cheek ---
      ctx.beginPath();
      ctx.arc(2, 4, 3.2, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(244, 63, 94, 0.4)";
      ctx.fill();

      // --- Beak ---
      ctx.beginPath();
      ctx.moveTo(11, -3);
      ctx.lineTo(21, 1.5);
      ctx.lineTo(11, 6.5);
      ctx.closePath();
      ctx.fillStyle = "#fb923c";
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = "#9a3412";
      ctx.stroke();

      // Beak mouth separation line
      ctx.beginPath();
      ctx.moveTo(11.5, 1.8);
      ctx.lineTo(19, 1.8);
      ctx.strokeStyle = "#c2410c";
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // --- Big Cartoon Eye ---
      ctx.beginPath();
      ctx.arc(6, -4, 5.5, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = "#854d0e";
      ctx.stroke();

      // Pupil
      ctx.beginPath();
      ctx.arc(8, -4, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = "#0f172a";
      ctx.fill();

      // Eye catchlight highlight
      ctx.beginPath();
      ctx.arc(7, -5.2, 1, 0, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();

      // --- Animated Flapping Wing ---
      ctx.save();
      ctx.translate(-4, 0);
      ctx.rotate(wingFlap * 0.38);
      ctx.beginPath();
      ctx.ellipse(-2, 1, 8.5, 5.5, -0.2, 0, Math.PI * 2);
      ctx.fillStyle = "#fde047";
      ctx.fill();
      ctx.lineWidth = 1.8;
      ctx.strokeStyle = "#ca8a04";
      ctx.stroke();
      ctx.restore();

      ctx.restore();
    }

    // Draw styled pipes with rims and shading
    function drawPipes() {
      const capHeight = 22;
      const capOverhang = 4;

      for (const pipe of pipes) {
        // Gradient for pipes
        const pipeGrad = ctx.createLinearGradient(pipe.x, 0, pipe.x + PIPE_WIDTH, 0);
        pipeGrad.addColorStop(0, "#86efac");
        pipeGrad.addColorStop(0.3, "#4ade80");
        pipeGrad.addColorStop(0.7, "#22c55e");
        pipeGrad.addColorStop(1, "#15803d");

        // Top Pipe Body
        ctx.fillStyle = pipeGrad;
        ctx.fillRect(pipe.x, 0, PIPE_WIDTH, Math.max(0, pipe.gapY - capHeight));
        ctx.strokeStyle = "#166534";
        ctx.lineWidth = 2;
        ctx.strokeRect(pipe.x, 0, PIPE_WIDTH, Math.max(0, pipe.gapY - capHeight));

        // Top Pipe Cap Rim
        ctx.fillRect(pipe.x - capOverhang, pipe.gapY - capHeight, PIPE_WIDTH + capOverhang * 2, capHeight);
        ctx.strokeRect(pipe.x - capOverhang, pipe.gapY - capHeight, PIPE_WIDTH + capOverhang * 2, capHeight);

        // Bottom Pipe Cap Rim
        ctx.fillRect(pipe.x - capOverhang, pipe.gapY + PIPE_GAP, PIPE_WIDTH + capOverhang * 2, capHeight);
        ctx.strokeRect(pipe.x - capOverhang, pipe.gapY + PIPE_GAP, PIPE_WIDTH + capOverhang * 2, capHeight);

        // Bottom Pipe Body
        const bottomBodyY = pipe.gapY + PIPE_GAP + capHeight;
        const bottomBodyHeight = (canvas.height - GROUND_HEIGHT) - bottomBodyY;
        if (bottomBodyHeight > 0) {
          ctx.fillRect(pipe.x, bottomBodyY, PIPE_WIDTH, bottomBodyHeight);
          ctx.strokeRect(pipe.x, bottomBodyY, PIPE_WIDTH, bottomBodyHeight);
        }
      }
    }

    // Draw text (score, messages)
    function drawUI() {
      // Score with drop shadow
      ctx.save();
      ctx.fillStyle = "#fff";
      ctx.font = "bold 32px 'Segoe UI', Arial, sans-serif";
      ctx.textAlign = "center";
      ctx.shadowColor = "rgba(0,0,0,0.4)";
      ctx.shadowBlur = 6;
      ctx.shadowOffsetX = 2;
      ctx.shadowOffsetY = 2;
      ctx.fillText(score.toString(), canvas.width / 2, 60);
      ctx.restore();

      // Best Score
      ctx.font = "bold 15px 'Segoe UI', Arial, sans-serif";
      ctx.textAlign = "left";
      ctx.fillStyle = "rgba(255,255,255,0.9)";
      ctx.fillText("Best: " + bestScore, 14, 26);

      if (!started && !gameOver) {
        ctx.textAlign = "center";
        ctx.font = "bold 18px 'Segoe UI', Arial, sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "rgba(0,0,0,0.5)";
        ctx.shadowBlur = 4;
        ctx.fillText("Press Space or Click to start", canvas.width / 2, canvas.height / 2 - 40);
      }

      if (gameOver) {
        ctx.save();
        ctx.textAlign = "center";
        ctx.fillStyle = "#ef4444";
        ctx.font = "bold 32px 'Segoe UI', Arial, sans-serif";
        ctx.shadowColor = "rgba(0,0,0,0.6)";
        ctx.shadowBlur = 8;
        ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 25);

        ctx.font = "16px 'Segoe UI', Arial, sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.shadowBlur = 4;
        ctx.fillText("Press SPACE or CLICK to restart", canvas.width / 2, canvas.height / 2 + 15);
        ctx.restore();
      }
    }

    // Main update loop
    function update() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Decorative background clouds
      ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
      ctx.beginPath();
      ctx.arc(60, 100, 25, 0, Math.PI * 2);
      ctx.arc(90, 95, 32, 0, Math.PI * 2);
      ctx.arc(120, 100, 24, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(280, 160, 22, 0, Math.PI * 2);
      ctx.arc(310, 155, 30, 0, Math.PI * 2);
      ctx.arc(340, 160, 20, 0, Math.PI * 2);
      ctx.fill();

      frameCount++;

      if (!gameOver && started) {
        // Bird physics with fall limit
        birdVelocity += GRAVITY;
        if (birdVelocity > MAX_FALL_SPEED) {
          birdVelocity = MAX_FALL_SPEED;
        }
        birdY += birdVelocity;

        // Pipes movement and management
        for (let i = 0; i < pipes.length; i++) {
          pipes[i].x -= PIPE_SPEED;
        }

        // Remove off-screen pipes and increment score
        if (pipes.length && pipes[0].x + PIPE_WIDTH < 0) {
          pipes.shift();
          score++;
          if (score > bestScore) bestScore = score;
          playPointSound();
        }

        // Create new pipes at comfortable intervals
        if (frameCount % Math.round(PIPE_INTERVAL / PIPE_SPEED) === 0) {
          createPipe();
        }

        // Collision check
        if (checkCollision()) {
          gameOver = true;
          playGameOverSound();
        }
      } else if (!started) {
        // Gentle hovering animation before game starts
        birdY = (canvas.height / 2) + Math.sin(frameCount * 0.08) * 8;
      }

      // Draw pipes, bird, ground, and UI
      drawPipes();
      drawBird();

      // Ground (Flappy grass and dirt ground)
      ctx.fillStyle = "#ded895";
      ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, GROUND_HEIGHT);
      ctx.fillStyle = "#65a30d";
      ctx.fillRect(0, canvas.height - GROUND_HEIGHT, canvas.width, 10);
      ctx.strokeStyle = "#4d7c0f";
      ctx.lineWidth = 2;
      ctx.strokeRect(0, canvas.height - GROUND_HEIGHT, canvas.width, 10);

      drawUI();

      requestAnimationFrame(update);
    }

    // Make the bird jump
    function flap() {
      getAudioContext();
      if (!started && !gameOver) {
        started = true;
      }
      if (!gameOver) {
        birdVelocity = JUMP_STRENGTH;
      }
    }

    // Handle key events
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") {
        e.preventDefault();
        if (gameOver) {
          resetGame();
        } else {
          flap();
        }
      } else if (e.code === "Enter" && gameOver) {
        resetGame();
      }
    });

    // Mouse / touch for mobile & desktop
    canvas.addEventListener("mousedown", () => {
      if (gameOver) {
        resetGame();
      } else {
        flap();
      }
    });

    canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();
      if (gameOver) {
        resetGame();
      } else {
        flap();
      }
    }, { passive: false });

    // Start
    resetGame();
    update();
  </script>
</body>
</html>
